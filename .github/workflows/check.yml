# Loosely based upon:
#   https://github.com/actions/starter-workflows/blob/main/ci/php.yml
name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  check:

    runs-on: ubuntu-latest
    needs: phplint
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: [7.2, 7.3, 7.4, 8.0, 8.1, 8.2, 8.3, 8.4, 8.5]
        laravel-version: [6.*, 7.*, 8.*, 9.*, 10.*, 11.*, 12.*, 13.*]
        include:
          - laravel-version: 6.*
            testbench: 4.*
          - laravel-version: 7.*
            testbench: 5.*
          - laravel-version: 8.*
            testbench: 6.*
          - laravel-version: 9.*
            testbench: 7.*
          - laravel-version: 10.*
            testbench: 8.*
          - laravel-version: 11.*
            testbench: 9.*
          - laravel-version: 12.*
            testbench: 10.*
          - laravel-version: 13.*
            testbench: 11.*

        exclude:
          # Laravel 13 requires PHP >= 8.3
          - laravel-version: 13.*
            php-version: 7.2
          - laravel-version: 13.*
            php-version: 7.3
          - laravel-version: 13.*
            php-version: 7.4
          - laravel-version: 13.*
            php-version: 8.0
          - laravel-version: 13.*
            php-version: 8.1
          - laravel-version: 13.*
            php-version: 8.2
          # Laravel 12 requires PHP >= 8.2
          - laravel-version: 12.*
            php-version: 7.2
          - laravel-version: 12.*
            php-version: 7.3
          - laravel-version: 12.*
            php-version: 7.4
          - laravel-version: 12.*
            php-version: 8.0
          - laravel-version: 12.*
            php-version: 8.1
          # Laravel 11 requires PHP >= 8.2
          - laravel-version: 11.*
            php-version: 7.2
          - laravel-version: 11.*
            php-version: 7.3
          - laravel-version: 11.*
            php-version: 7.4
          - laravel-version: 11.*
            php-version: 8.0
          - laravel-version: 11.*
            php-version: 8.1
          # Laravel 10 requires PHP >= 8.1
          - laravel-version: 10.*
            php-version: 7.2
          - laravel-version: 10.*
            php-version: 7.3
          - laravel-version: 10.*
            php-version: 7.4
          - laravel-version: 10.*
            php-version: 8.0
          # Laravel 9 requires PHP >= 8.0
          - laravel-version: 9.*
            php-version: 7.2
          - laravel-version: 9.*
            php-version: 7.3
          - laravel-version: 9.*
            php-version: 7.4
          # Laravel 8 requires PHP >= 7.3
          - laravel-version: 8.*
            php-version: 7.2
          # Laravel 6/7 max PHP 8.0
          - laravel-version: 6.*
            php-version: 8.1
          - laravel-version: 7.*
            php-version: 8.1
          - laravel-version: 6.*
            php-version: 8.2
          - laravel-version: 7.*
            php-version: 8.2
          - laravel-version: 6.*
            php-version: 8.3
          - laravel-version: 7.*
            php-version: 8.3
          - laravel-version: 6.*
            php-version: 8.4
          - laravel-version: 7.*
            php-version: 8.4
          - laravel-version: 6.*
            php-version: 8.5
          - laravel-version: 7.*
            php-version: 8.5
          # Laravel 8 max PHP 8.1
          - laravel-version: 8.*
            php-version: 8.2
          - laravel-version: 8.*
            php-version: 8.3
          - laravel-version: 8.*
            php-version: 8.4
          - laravel-version: 8.*
            php-version: 8.5
          # Laravel 9 max PHP 8.2
          - laravel-version: 9.*
            php-version: 8.3
          - laravel-version: 9.*
            php-version: 8.4
          - laravel-version: 9.*
            php-version: 8.5
          # Laravel 10 max PHP 8.3
          - laravel-version: 10.*
            php-version: 8.4
          - laravel-version: 10.*
            php-version: 8.5
          # Laravel 11 max PHP 8.4
          - laravel-version: 11.*
            php-version: 8.5

    name: P${{ matrix.php-version }} - L${{ matrix.laravel-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Allow installing packages with security advisories
        run: composer config audit.block-insecure false

      - name: Install dependencies
        env:
          LARAVEL_VERSION: ${{ matrix.laravel-version }}
          TESTBENCH_VERSION: ${{ matrix.testbench }}
        run: |
          composer require "laravel/framework:${LARAVEL_VERSION}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${TESTBENCH_VERSION}" --no-interaction --no-update
          composer install --prefer-dist --no-progress

      # the test script is configured in composer.json.
      # see: https://getcomposer.org/doc/articles/scripts.md
      - name: Run test suite
        run: composer run-script test

  phplint:
    runs-on: ubuntu-latest
    name: PHP Linting (Pint)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: "laravel-pint"
        uses: aglipanci/laravel-pint-action@1.0.0
        with:
          preset: laravel
