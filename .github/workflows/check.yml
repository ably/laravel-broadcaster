# Loosely based upon:
#   https://github.com/actions/starter-workflows/blob/main/ci/php.yml
name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  check:

    runs-on: ubuntu-latest
    needs: phplint
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: [8.2, 8.3, 8.4, 8.5]
        laravel-version: [11.*, 12.*, 13.*]
        include:
          - laravel-version: 11.*
            testbench: 9.*
          - laravel-version: 12.*
            testbench: 10.*
          - laravel-version: 13.*
            testbench: 11.*

        exclude:
          # Laravel 8-10 and PHP 8.1 are served by the 1.x branch
          # Laravel 13 requires PHP >= 8.3
          - laravel-version: 13.*
            php-version: 8.2
          # Laravel 11 supports PHP 8.2 - 8.4
          - laravel-version: 11.*
            php-version: 8.5

    name: P${{ matrix.php-version }} - L${{ matrix.laravel-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: ${{ matrix.php-version }}

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Allow installing packages with security advisories
        run: composer config audit.block-insecure false

      - name: Install dependencies
        env:
          LARAVEL_VERSION: ${{ matrix.laravel-version }}
          TESTBENCH_VERSION: ${{ matrix.testbench }}
        run: |
          composer require "laravel/framework:${LARAVEL_VERSION}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${TESTBENCH_VERSION}" --no-interaction --no-update
          composer install --prefer-dist --no-progress

      # the test script is configured in composer.json.
      # see: https://getcomposer.org/doc/articles/scripts.md
      - name: Run test suite
        run: composer run-script test

  phplint:
    runs-on: ubuntu-latest
    name: PHP Linting (Pint)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # Pint is pinned and installed by setup-php: the previous action built from composer:latest,
      # which lost ext-mbstring and silently fell back to an old Pint that crashes.
      - name: Set up PHP with Pint
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: '8.3'
          tools: pint:1.32.3

      - name: Run Pint
        run: pint --preset laravel
